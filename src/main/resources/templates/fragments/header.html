<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header">
    <nav style="display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background-color: #172554; color: white;">
        <a th:href="@{/}" style="color: white; font-weight: bold; text-decoration: none; font-size: 20px;">UTEShop</a>
        
        <div th:if="${#authorization.expression('isAuthenticated()')}" style="display: flex; align-items: center; gap: 12px;">
            <!-- Avatar -->
            <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
                 alt="Avatar" width="40" height="40" style="border-radius: 50%; object-fit: cover;">
            
            <!-- Full name -->
            <span th:text="${#authentication.principal.fullName}">Nguyễn Văn A</span>
            
            <!-- Username -->
            <span th:text="'(' + ${#authentication.principal.username} + ')'">(nguyenvana)</span>
            
            <!-- Email -->
            <span th:text="${#authentication.principal.email}">email@gmail.com</span>
            
            <!-- Role -->
            <span th:text="${#authentication.principal.role}">ROLE_USER</span>
            
            <!-- Logout -->
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" style="background: none; border: none; color: #f87171; cursor: pointer; text-decoration: underline;">Đăng xuất</button>
            </form>
        </div>

        <div th:unless="${#authorization.expression('isAuthenticated()')}">
            <a th:href="@{/login}" style="color: white; text-decoration: none;">Đăng nhập</a>
        </div>
    </nav>
</header>
</body>
</html>
