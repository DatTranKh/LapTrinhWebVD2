<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h2>Đăng nhập</h2>
    
    <div class="alert error" th:if="${param.error}">
        <p style="margin: 0; color: red;">Username/email hoặc password không đúng</p>
    </div>
    <div class="alert success" th:if="${param.logout}">
        <p style="margin: 0; color: green;">Bạn đã đăng xuất thành công</p>
    </div>

    <form th:action="@{/login}" method="post">
        <div>
            <label>Username hoặc Email</label>
            <input type="text" name="username" placeholder="Username hoặc email" required autofocus>
        </div>
        <div>
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="btn primary full mt">Đăng nhập</button>
    </form>
</div>
</body>
</html>
